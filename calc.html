<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Calculator</title>
</head>
<body>
  <div class="container_head">
    <p class="head">Welcome to the Calculator</p>
  </div>
  <!-- use inspect on the page to see the calculation -->
  <div class="container_body">
    <a href="index.html" class="a">Home</a>
    <a href="keyboard.html" class="a">Keyboard</a>
    <p>
    <button onclick="
  calculation+= '1';
  console.log(`${calculation}`);
    ">1</button>

    <button onclick="
  calculation+= '2';
  console.log(`${calculation}`);
  ">2</button>

    <button onclick="
  calculation+= '3';
  console.log(`${calculation}`);
  ">3</button>
  </p>


  <p>
    <button onclick="
  calculation+= '4';
  console.log(`${calculation}`);
  ">4</button>

    <button onclick="
  calculation+= '5';
  console.log(`${calculation}`);
  ">5</button>

  <button onclick="
  calculation+= '6';
  console.log(`${calculation}`);
  ">6</button>
  </p>


  <p>
    <button onclick="
  calculation+= '7';
  console.log(`${calculation}`);
  ">7</button>

  <button onclick="
  calculation+= '8';
  console.log(`${calculation}`);
  ">8</button>

  <button onclick="
  calculation+= '9';
  console.log(`${calculation}`);
  ">9</button>
  </p>


  <p>
    <button onclick="
  calculation+= ' + ';
  console.log(`${calculation}`);
  ">+</button>

  <button onclick="
  calculation+= ' - ';
  console.log(`${calculation}`);
  ">-</button>

  <button onclick="
  calculation+= ' * ';
  console.log(`${calculation}`);
  ">*</button>
  </p>
  

  <button onclick="
  calculation+= ' / ';
  console.log(`${calculation}`);
  ">/</button>

  <button onclick="
  eval(calculation);
  calculation= eval(calculation);
  console.log(`${calculation}`);
  ">=</button>

  
  <script>
    let calculation= '';
  </script>
  </div>
</body>
</html>
